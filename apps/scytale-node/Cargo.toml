[package]
name = "scytale-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI and node daemon orchestrator for Scytale blockchain"

[lints]
workspace = true

[dependencies]
libp2p = { version = "0.56", features = ["tokio", "tcp", "dns", "noise", "yamux", "gossipsub", "request-response", "kad", "identify", "ping", "autonat", "relay", "macros"] }
futures-util = "0.3"
async-trait = "0.1"
scytale-primitives = { path = "../../crates/scytale-primitives" }
scytale-core = { path = "../../crates/scytale-core" }
scytale-storage = { path = "../../crates/scytale-storage" }
scytale-consensus = { path = "../../crates/scytale-consensus" }
scytale-mempool = { path = "../../crates/scytale-mempool" }
scytale-mining = { path = "../../crates/scytale-mining" }
scytale-bridge = { path = "../../crates/scytale-bridge" }
scytale-script = { path = "../../crates/scytale-script" }
scytale-sdk = { path = "../../crates/scytale-sdk", features = ["std"] }
scytale-vm = { path = "../../crates/scytale-vm" }
scytale-account = { path = "../../crates/scytale-account" }
scytale-stratum = { path = "../../crates/scytale-stratum" }
blake3 = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.7"
ed25519-dalek = { version = "2.1", default-features = false }
tower-http = { version = "0.5", features = ["cors"] }
crossbeam-channel = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
blake3 = { workspace = true }
ed25519-dalek = { version = "2.1", default-features = false }
bincode = { workspace = true }
serde = { workspace = true }
