[package]
name = "scytale-studio"
version = "0.1.0"
description = "Scytale Desktop Workbench"
authors = ["Scytale Core Contributors"]
edition = "2021"

[lib]
name = "scytale_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
portable-pty = "0.8"
ureq = { version = "2.10", features = ["json", "tls"] }
scytale-account = { path = "../../../crates/scytale-account" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
