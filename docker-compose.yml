services:
  node-1:
    image: scytale:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scytale-node1
    hostname: node1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.10
    ports:
      - "127.0.0.1:8332:8332"
    volumes:
      - scytale_node1_data:/data
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8332"
      - "--mine"
      - "--miner-payout"
      - "${SCYTALE_MINER_PAYOUT_SCRIPT:?SCYTALE_MINER_PAYOUT_SCRIPT must be set}"

  node-2:
    image: scytale:latest
    container_name: scytale-node2
    hostname: node2
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.20
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - scytale_node2_data:/data
    depends_on:
      - node-1
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8333"
      - "--bootnodes"
      - "/ip4/172.28.0.10/tcp/9000"

  node-3:
    image: scytale:latest
    container_name: scytale-node3
    hostname: node3
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.30
    ports:
      - "127.0.0.1:8334:8334"
    volumes:
      - scytale_node3_data:/data
    depends_on:
      - node-1
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8334"
      - "--bootnodes"
      - "/ip4/172.28.0.10/tcp/9000"

  node-4:
    image: scytale:latest
    container_name: scytale-node4
    hostname: node4
    networks:
      scytale-net:
        ipv4_address: 172.28.0.40
    ports:
      - "127.0.0.1:8335:8335"
    volumes:
      - scytale_node4_data:/data
    depends_on:
      - node-2
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8335"
      - "--bootnodes"
      - "/ip4/172.28.0.20/tcp/9000"

networks:
  scytale-net:
    name: scytale-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  scytale_node1_data:
  scytale_node2_data:
  scytale_node3_data:
  scytale_node4_data:
