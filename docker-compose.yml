services:
  node-1:
    image: scytale:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scytale-node1
    hostname: node1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.10
    ports:
      - "8332:8332"
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8332"
      - "--target"
      - "0x217fffff"
      - "--mine"
      - "--miner-payout"
      - "${SCYTALE_MINER_PAYOUT_SCRIPT:?SCYTALE_MINER_PAYOUT_SCRIPT must be set}"

  node-2:
    image: scytale:latest
    container_name: scytale-node2
    hostname: node2
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.20
    ports:
      - "8333:8333"
    depends_on:
      - node-1
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8333"
      - "--target"
      - "0x217fffff"

  node-3:
    image: scytale:latest
    container_name: scytale-node3
    hostname: node3
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      scytale-net:
        ipv4_address: 172.28.0.30
    ports:
      - "8334:8334"
    depends_on:
      - node-1
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8334"
      - "--target"
      - "0x217fffff"

  node-4:
    image: scytale:latest
    container_name: scytale-node4
    hostname: node4
    networks:
      scytale-net:
        ipv4_address: 172.28.0.40
    ports:
      - "8335:8335"
    depends_on:
      - node-2
    command:
      - "scytale-node"
      - "--data-dir"
      - "/data"
      - "--socket"
      - "/run/scytale/node.sock"
      - "start"
      - "--http-bind"
      - "0.0.0.0:8335"
      - "--target"
      - "0x217fffff"

networks:
  scytale-net:
    name: scytale-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
