<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Core Cyan/Emerald Gradients -->
    <linearGradient id="scytalePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="scytaleAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="coreRod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate / Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Decorative Lattice Grid -->
  <path d="M120 72 L392 72 M120 440 L392 440" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0F172A" stroke-width="32" opacity="0.7" />

  <!-- Cryptographic Cylinder Core (The Rod) -->
  <g transform="rotate(-25 256 256)">
    <!-- Central Hexagonal Rod Column -->
    <rect x="228" y="96" width="56" height="320" rx="28" fill="url(#coreRod)" stroke="#334155" stroke-width="3" />
    
    <!-- State Commitment Leaf Notches -->
    <line x1="228" y1="160" x2="284" y2="160" stroke="#00F2FE" stroke-width="2" opacity="0.4" />
    <line x1="228" y1="256" x2="284" y2="256" stroke="#00F2FE" stroke-width="2" opacity="0.4" />
    <line x1="228" y1="352" x2="284" y2="352" stroke="#00F2FE" stroke-width="2" opacity="0.4" />

    <!-- Helical Cryptographic Ribbon Forming the "S" -->
    <!-- Top Turn -->
    <path d="M168 152 C168 116, 280 100, 332 144 C364 172, 356 208, 308 224 L196 260" 
          fill="none" stroke="url(#scytalePrimary)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)" />
    
    <!-- Bottom Turn -->
    <path d="M316 252 L204 288 C156 304, 148 340, 180 368 C232 412, 344 396, 344 360" 
          fill="none" stroke="url(#scytalePrimary)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)" />

    <!-- Inner Sharp Angular Interlink -->
    <path d="M212 256 L300 256" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9" />

    <!-- Merkle State Beacon Nodes -->
    <circle cx="168" cy="152" r="10" fill="#FFFFFF" />
    <circle cx="344" cy="360" r="10" fill="#10B981" />
  </g>
</svg>
