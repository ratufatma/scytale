[workspace]
resolver = "2"
members = [
    "crates/scytale-core",
    "crates/scytale-storage",
    "crates/scytale-consensus",
    "crates/scytale-mempool",
    "crates/scytale-network",
    "apps/scytale-node",
]

[workspace.dependencies]
redb = "2.4"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
