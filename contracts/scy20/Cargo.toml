[package]
name = "scy20"
version = "0.1.0"
edition = "2021"
authors = ["Scytale Core Developers"]
description = "Scy-20 Fungible Token Standard for Scytale eUTXO Smart Contracts"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "1.0", default-features = false }
blake3 = { version = "1.5", default-features = false }

[dev-dependencies]
serde_json = "1.0"
