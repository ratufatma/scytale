[package]
name = "scytale-contract-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scytale-sdk = { path = "../../crates/scytale-sdk" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
ed25519-dalek = "2.1"
scytale-sdk = { path = "../../crates/scytale-sdk", features = ["std"] }

