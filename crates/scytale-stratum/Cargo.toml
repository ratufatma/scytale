[package]
name = "scytale-stratum"
version = "0.4.0"
edition = "2021"
authors = ["Ratu Fatma Setyaningrum <ratu@myratu.com>"]
description = "High-performance Stratum mining pool server (SSP-1) for Scytale Layer-1"
license = "MIT OR Apache-2.0"

[dependencies]
scytale-core = { path = "../scytale-core" }
scytale-consensus = { path = "../scytale-consensus" }
blake3 = { version = "1.5", features = ["rayon"] }
tokio = { version = "1.38", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
thiserror = "1.0"
byteorder = "1.5"
futures = "0.3"
dashmap = "6.0"
hex = { workspace = true }
uint = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
