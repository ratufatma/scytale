[package]
name = "scytale-indexer"
version = "0.1.0"
edition = "2021"
authors = ["Ratu <ratufatmasetyaningrum@gmail.com>", "Scytale Core Contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Workspace dependencies
scytale-core = { path = "../scytale-core" }
scytale-storage = { path = "../scytale-storage" }
